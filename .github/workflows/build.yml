name: Build Deess Pocket

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deess-pocket-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_VERSION: "0.2.0"

jobs:
  macos:
    name: macOS Universal (VST3 + AAX)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.4
        run: |
          curl -fL https://github.com/juce-framework/JUCE/releases/download/8.0.4/juce-8.0.4-osx.zip -o juce.zip
          unzip -q juce.zip

      - name: Configure universal build
        run: cmake -S . -B build -G Xcode -DDEESS_BUILD_PLUGIN=ON -DDEESS_BUILD_TESTS=ON -DJUCE_DIR="$PWD/JUCE" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3, AAX and tests
        run: cmake --build build --config Release --target DeessPocket_VST3 DeessPocket_AAX deess_core_tests

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate macOS VST3
        run: |
          set -o pipefail
          curl -fL https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$PWD/build/DeessPocket_artefacts/Release/VST3/Deess Pocket.vst3" 2>&1 | tee pluginval-macos.log

      - name: Package macOS plug-ins
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/DeessPocket_artefacts/Release/VST3/Deess Pocket.vst3" "DeessPocket-v${PLUGIN_VERSION}-macOS-Universal-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/DeessPocket_artefacts/Release/AAX/Deess Pocket.aaxplugin" "DeessPocket-v${PLUGIN_VERSION}-macOS-Universal-AAX.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DeessPocket-v${{ env.PLUGIN_VERSION }}-macOS-Universal-VST3
          path: DeessPocket-v${{ env.PLUGIN_VERSION }}-macOS-Universal-VST3.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DeessPocket-v${{ env.PLUGIN_VERSION }}-macOS-Universal-AAX
          path: DeessPocket-v${{ env.PLUGIN_VERSION }}-macOS-Universal-AAX.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-log-macos
          path: pluginval-macos.log
          if-no-files-found: ignore

  windows:
    name: Windows x64 (VST3 + AAX)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.4.zip -OutFile juce.zip
          Expand-Archive juce.zip -DestinationPath juce-unpack
          Move-Item juce-unpack/JUCE-8.0.4 JUCE

      - name: Configure x64 build
        run: cmake -S . -B build -A x64 -DDEESS_BUILD_PLUGIN=ON -DDEESS_BUILD_TESTS=ON -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build VST3, AAX and tests
        run: cmake --build build --config Release --target DeessPocket_VST3 DeessPocket_AAX deess_core_tests

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate Windows VST3
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-unpack
          $validator = (Get-ChildItem pluginval-unpack -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          if (-not $validator) { throw "pluginval executable not found" }
          & $validator --strictness-level 5 --validate "$PWD/build/DeessPocket_artefacts/Release/VST3/Deess Pocket.vst3" 2>&1 | Tee-Object -FilePath pluginval-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows plug-ins
        shell: pwsh
        run: |
          Compress-Archive -Path "build/DeessPocket_artefacts/Release/VST3/Deess Pocket.vst3" -DestinationPath "DeessPocket-v${env:PLUGIN_VERSION}-Windows-x64-VST3.zip"
          Compress-Archive -Path "build/DeessPocket_artefacts/Release/AAX/Deess Pocket.aaxplugin" -DestinationPath "DeessPocket-v${env:PLUGIN_VERSION}-Windows-x64-AAX.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DeessPocket-v${{ env.PLUGIN_VERSION }}-Windows-x64-VST3
          path: DeessPocket-v${{ env.PLUGIN_VERSION }}-Windows-x64-VST3.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DeessPocket-v${{ env.PLUGIN_VERSION }}-Windows-x64-AAX
          path: DeessPocket-v${{ env.PLUGIN_VERSION }}-Windows-x64-AAX.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-log-windows
          path: pluginval-windows.log
          if-no-files-found: ignore
